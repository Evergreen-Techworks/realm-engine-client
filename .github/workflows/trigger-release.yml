name: Trigger desktop release build

# This repo is where the desktop client is developed, but it cannot build its
# own installer: SETUP.md strips the il2cpp headers (~94 MB) and game XML
# (~85 MB) from the tree, and `npm run build:native` needs the headers to
# compile internal/. So a push here hands the build off to the PRIVATE repo
# (Evergreen-Techworks/realm-engine), whose release-client.yml checks THIS
# commit out, overlays the stripped artifacts, builds the NSIS installer,
# uploads it to the API, and cuts the archive release back on this repo.
#
# Token: reuses BEEBYTE_DISPATCH_TOKEN, already configured on this repo as
# "a PAT that can trigger workflow_dispatch on Evergreen-Techworks/realm-engine"
# — exactly the call this workflow makes. GITHUB_TOKEN cannot reach another
# repository, so a PAT is unavoidable; there is no reason to provision a
# second one. (Its previous consumer, beebyte-scan-on-push.yml, dispatches a
# workflow that no longer exists on realm-engine — those runs fail on the
# missing target, not on the token.)
#
# Run this workflow manually with `check_token_only` to confirm the token is
# still alive in a few seconds, without spending 40 minutes of Windows runner
# time on a build.
#
# To build without pushing, either run this workflow manually or run the
# private repo's "Build + publish desktop client release" directly — it takes
# a `client_ref` input and defaults to this repo's main.

on:
  push:
    branches: [main]
    paths:
      # The build inputs. Docs/CI-only changes shouldn't spend 40 minutes of
      # Windows runner time or burn a version number.
      - "client/**"
      - "internal/**"
      - "sdk/**"
      - ".github/workflows/trigger-release.yml"
  workflow_dispatch:
    inputs:
      client_ref:
        description: "Ref of THIS repo to build (blank = the commit this runs on)"
        required: false
        default: ""
      publish:
        description: "Publish immediately; false stages an unpublished draft"
        required: false
        default: "true"
      check_token_only:
        description: "Only verify the dispatch token; do not start a build"
        type: boolean
        required: false
        default: false

# One dispatch at a time. The private workflow serializes builds on its own
# concurrency group anyway, so racing dispatches would just queue there — but
# cancelling superseded ones here means a burst of pushes triggers the newest
# tree rather than a backlog of stale builds.
concurrency:
  group: trigger-release
  cancel-in-progress: true

env:
  TARGET_REPO: Evergreen-Techworks/realm-engine

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Verify the dispatch token can reach the private repo
        # A read-only probe. Without it, a missing or expired PAT surfaces as
        # an opaque 404 from the dispatch call — GitHub returns "Not Found"
        # rather than 401 for a token that cannot see the repo at all.
        env:
          GH_TOKEN: ${{ secrets.BEEBYTE_DISPATCH_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::error::BEEBYTE_DISPATCH_TOKEN is not set on this repository."
            echo "Add a PAT with Actions read+write on ${TARGET_REPO} (fine-grained),"
            echo "or classic \`repo\` scope, as the BEEBYTE_DISPATCH_TOKEN secret."
            exit 1
          fi
          if ! count=$(gh api "repos/${TARGET_REPO}/actions/workflows" --jq '.total_count' 2>&1); then
            echo "::error::BEEBYTE_DISPATCH_TOKEN cannot read ${TARGET_REPO} Actions."
            echo "It is most likely expired or missing the Actions scope. Response:"
            echo "${count}"
            exit 1
          fi
          echo "Token OK — ${TARGET_REPO} reports ${count} workflows."

      - name: Dispatch build to the private repo
        if: ${{ !inputs.check_token_only }}
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.BEEBYTE_DISPATCH_TOKEN }}
          script: |
            const [owner, repo] = process.env.TARGET_REPO.split('/');
            const sha = context.eventName === 'push'
              ? context.sha
              : (context.payload.inputs?.client_ref || context.sha);

            // The private repo builds this SHA but cannot read this push's
            // commit messages, and they become the release changelog. Subject
            // lines only, and capped: workflow_dispatch inputs are limited to
            // 65,535 characters across all values.
            const notes = (context.payload.commits || [])
              .map(c => `- ${String(c.message).split('\n')[0].slice(0, 200)}`)
              .slice(-30)
              .join('\n')
              .slice(0, 60000);

            const inputs = {
              client_ref: sha,
              publish: String(context.payload.inputs?.publish ?? 'true'),
            };
            // Leave `notes` unset for a manual run with no commits, so
            // release-client.yml falls through to its own wording rather than
            // publishing an empty changelog.
            if (notes) inputs.notes = notes;

            await github.rest.actions.createWorkflowDispatch({
              owner,
              repo,
              workflow_id: 'release-client.yml',
              ref: 'main',
              inputs,
            });
            core.info(`Dispatched release-client.yml for ${sha} (publish=${inputs.publish})`);

      - name: Summary
        if: success()
        run: |
          {
            if [ "${{ inputs.check_token_only }}" = "true" ]; then
              echo "## Dispatch token verified"
              echo ""
              echo "\`BEEBYTE_DISPATCH_TOKEN\` can reach \`${TARGET_REPO}\`. No build was started."
            else
              echo "## Desktop release build dispatched"
              echo ""
              echo "Commit \`${GITHUB_SHA}\` was handed to the private repo's release workflow."
              echo ""
              echo "Watch it: https://github.com/${TARGET_REPO}/actions/workflows/release-client.yml"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
